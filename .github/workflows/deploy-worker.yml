name: Deploy Worker
# worker/ 변경이 main에 들어오면 Cloudflare Workers에 배포한다 (D-09).
# 필요한 secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# D1 database_id는 wrangler.toml에 직접 기입(공개 값, D-13).
on:
  push:
    branches: [main]
    paths: ["worker/**", "shared/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
concurrency: { group: deploy-worker, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: D1 스키마 적용(멱등)
        run: npx wrangler d1 execute hotdeal-hub --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Workers 배포
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Relay Collect
# 중계 수집(기본 경로): GitHub 서버에서 뽐뿌·뽐뿌쿠폰·루리웹을 가져와 Worker로 보낸다. 2026-10-27 확인: GitHub IP는 차단되지 않음.
# 5분마다 잡을 시작하고, 잡 안에서 60초 간격으로 약 4.5분 반복 → 사실상 1분 주기. 공개 저장소라 Actions 사용량은 무료.
# Worker는 최근 10분 내 중계가 들어온 소스를 Cron에서 건너뛴다. PC 중계(scripts/relay-start.ps1)는 선택 사항(동시에 돌아도 dedupe로 중복 없음).
# 필요한 secret: RELAY_TOKEN (= Worker의 ADMIN_TOKEN), variable: API_BASE
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
concurrency: { group: relay, cancel-in-progress: false }
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - run: npm ci
      - run: npm run build:relay
      - name: 중계 실행 (60초 간격, 최대 270초)
        env:
          RELAY_API: ${{ vars.API_BASE }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          RELAY_SOURCES: ppomppu,ppomppu_coupon,ruliweb
          RELAY_UA: "Mozilla/5.0 (compatible; HotdealHubRelay/0.1 GitHubActions; +https://hotdeal-hub.pages.dev/about/)"
        run: |
          [ -z "$RELAY_TOKEN" ] && { echo "::error::RELAY_TOKEN secret 이 없습니다"; exit 1; }
          set +e
          timeout 270 node dist/relay.mjs --loop 60
          code=$?
          # 124 = timeout 이 정상 종료시킨 것
          [ "$code" -eq 0 ] || [ "$code" -eq 124 ] || { echo "::error::relay exit $code"; exit "$code"; }
          echo "relay loop finished (exit $code)"

<article class="card flex flex-col p-4 sm:p-5" data-deal-id="{{id}}" data-brand="{{brand}}" data-status="{{status}}">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="text-xs font-semibold text-brand-700">{{brandName}} <span class="text-ink-300">·</span> <span class="text-ink-500">{{merchantName}}</span></p>
      <h3 class="mt-1 line-clamp-2 text-[15px] font-bold leading-snug text-ink-900"><a href="/deal/{{id}}/" class="hover:underline">{{titleClean}}</a></h3>
    </div>
    <span class="{{statusChipClass}} shrink-0">{{statusLabel}}</span>
  </div>
  <dl class="mt-4 grid grid-cols-3 gap-2">
    <div class="stat"><dt>판매가</dt><dd>{{salePriceLabel}}</dd></div>
    <div class="stat"><dt>액면가</dt><dd>{{faceValueLabel}}</dd></div>
    <div class="stat"><dt>할인율</dt><dd class="text-brand-700">{{discountLabel}}</dd></div>
  </dl>
  <ul class="mt-3 flex flex-wrap gap-1.5 text-xs" aria-label="조건">
    {{cardChip}}{{limitChip}}{{paymentChip}}{{repeatChip}}{{rateGapChip}}{{affiliateChip}}
  </ul>
  <div class="mt-4 flex items-center justify-between gap-3 text-xs text-ink-500">
    <span>추천 {{votes}} · 댓글 {{comments}} · {{sourcesLabel}}</span>
    <a href="/deal/{{id}}/" class="font-semibold text-brand-700 hover:underline">상세 보기</a>
  </div>
</article>

<article class="card flex flex-col p-4 sm:p-5" data-deal-id="{{id}}" data-kind="product" data-merchant="{{merchant}}" data-status="{{status}}">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="text-xs font-semibold text-brand-700">{{merchantLabel}}</p>
      <h3 class="mt-1 line-clamp-2 text-[15px] font-bold leading-snug text-ink-900"><a href="/deal/{{id}}/" class="hover:underline">{{productName}}</a></h3>
    </div>
    <span class="{{statusChipClass}} shrink-0">{{statusLabel}}</span>
  </div>
  <dl class="mt-4 grid grid-cols-2 gap-2">
    <div class="stat"><dt>가격</dt><dd>{{priceLabel}}</dd></div>
    <div class="stat"><dt>배송비</dt><dd>{{shippingLabel}}</dd></div>
  </dl>
  <ul class="mt-3 flex flex-wrap gap-1.5 text-xs" aria-label="조건">
    {{cardChip}}{{limitChip}}{{paymentChip}}{{multiChip}}
  </ul>
  <div class="mt-auto flex items-center justify-between gap-3 pt-4 text-xs text-ink-500">
    <span>{{reactionLabel}}{{sourcesLabel}}</span>
    <a href="/deal/{{id}}/" class="shrink-0 font-semibold text-brand-700 hover:underline">상세 보기</a>
  </div>
</article>

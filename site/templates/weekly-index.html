{{> head}}
{{> header}}
{{> breadcrumb}}
<main id="main" class="container flex-1 py-8 md:py-12">
  <h1 class="text-3xl font-extrabold">주간 핫딜 비교</h1>
  <p class="mt-2 max-w-2xl text-ink-700">딜은 ISO 주차 단위로 묶입니다. 같은 브랜드·판매처·가격 조건이 여러 주에 걸쳐 반복되면 상시 특가, 한 주만 등장하면 단발 딜로 구분할 수 있습니다.</p>
  <div class="mt-8 overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="text-left text-xs text-ink-500"><tr><th class="py-2 pr-3 font-medium">주차</th><th class="py-2 pr-3 font-medium">기간(KST)</th><th class="py-2 pr-3 font-medium">딜 수</th><th class="py-2 pr-3 font-medium">브랜드 수</th><th class="py-2 font-medium">최대 할인</th></tr></thead>
      <tbody class="divide-y divide-ink-100">{{weekRows}}</tbody>
    </table>
  </div>
</main>
{{> footer}}

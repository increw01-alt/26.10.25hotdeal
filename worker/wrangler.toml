# Cloudflare Workers 설정 (D-09, D-13)
# 1) npm run db:create 실행 후 출력된 database_id를 아래에 넣는다.
# 2) secrets: wrangler secret put TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
name = "hotdeal-hub-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 커스텀 도메인(API)을 쓰려면 아래 주석을 풀고 도메인을 넣는다. Cloudflare DNS에 해당 도메인이 있어야 하며
# custom_domain = true 이면 DNS 레코드와 인증서를 Workers가 자동으로 만든다. (docs/DEPLOY.md 4단계)
# routes = [{ pattern = "api.example.com", custom_domain = true }]

[triggers]
# 1분 간격 수집 (Workers Paid 권장: CPU 30초, 한도 초과 시 과금)
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hotdeal-hub"
database_id = "f9a28aac-7dd4-4ecd-bbb6-bd2f956be092"

[vars]
SITE_NAME = "핫딜 허브"
SITE_URL = "https://hotdeal-hub.pages.dev"
# 공개 URL은 vars (D-13). 시세 연동을 켜려면 RATES_ENABLED="true"
RATES_ENABLED = "false"
RATES_JSON_URL = "https://REPLACE_WITH_RATES_JSON_URL"
RATES_SOURCE_NAME = "모두의시세"
# 운영 가드 (D-03)
GUARD_MIN_ACTIVE_RATIO = "0.5"
GUARD_STALE_HOURS = "2"
CB_FAIL_THRESHOLD = "5"
CB_COOLDOWN_MIN = "60"
FEED_CACHE_SECONDS = "900"
FETCH_TIMEOUT_MS = "10000"
USER_AGENT = "Mozilla/5.0 (compatible; HotdealHubBot/0.1; +https://hotdeal-hub.pages.dev/about/)"
# 에펨코리아 활성화 여부 (D-15)
ENABLE_FMKOREA = "false"

[observability]
enabled = true
